name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint mypy
      - name: Run Pylint
        run: |
          cd backend
          pylint app/ || true
      - name: Run Type Checks
        run: |
          cd backend
          mypy app/ || true

  build-docker:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -t ai-workflow-backend ./backend
      - name: Build Frontend Docker Image
        run: docker build -t ai-workflow-frontend ./frontend
